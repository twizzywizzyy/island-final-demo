<!DOCTYPE html>
<html>
<head>
  <title>Smoothie Sim</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// 🖼️ Load images
const background = new Image();
background.src = "background.png";

const shelf = new Image();
shelf.src = "shelf.png";

const veranaNormal = new Image();
veranaNormal.src = "verana.png";

const veranaBlink = new Image();
veranaBlink.src = "verana_blink.png";

// 👁️ Blink system
let isBlinking = false;

function blinkLoop() {
  const delay = Math.random() * 3000 + 2000;

  setTimeout(() => {
    isBlinking = true;

    setTimeout(() => {
      isBlinking = false;
      blinkLoop();
    }, 120);

  }, delay);
}

// 🎮 Draw function
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 🟦 BACKGROUND
  if (background.complete) {
    ctx.drawImage(background, 0, 0, canvas.width, canvas.height);
  }

  // 🧍 VERANA (proper scaling, no squish)
  if (veranaNormal.complete) {
    const veranaImage = isBlinking ? veranaBlink : veranaNormal;

    const scale = 0.5; // adjust if needed

    const width = veranaNormal.naturalWidth * scale;
    const height = veranaNormal.naturalHeight * scale;

    ctx.drawImage(veranaImage, 300, 200, width, height);
  }

  // 🪵 SHELF (top layer)
  if (shelf.complete) {
    ctx.drawImage(shelf, 0, 0, canvas.width, canvas.height);
  }

  requestAnimationFrame(draw);
}

// Start
blinkLoop();
draw();
</script>

</body>
</html>
