<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smoothie Shop!</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  /* BACKGROUND (bottom layer) */
  #bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 0%;
    height: 0%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }

  /* VERANA (middle layer) */
  #verana {
    position: absolute;
    bottom: 0;
    left: 0%;
     width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* SHELF (top layer) */
  #shelf {
    position: absolute;
    bottom: 0;
    left: 0%;
    width: 100%;
    height: 100%;
    z-index: 100;
    pointer-events: none;
  }
</style>
</head>

<body>

<!-- BACKGROUND -->
<img id="bg" src="background.png" />

<!-- VERANA -->
<img id="verana" src="verana.png" />

<!-- SHELF -->
<img id="shelf" src="shelf.png" />

<script>
const verana = document.getElementById("verana");

// blink function
function blink() {
  verana.src = "verana_blink.png";

  setTimeout(() => {
    verana.src = "verana.png";
  }, 150); // blink speed (ms)
}

// random blinking so it feels natural
function startBlinkLoop() {
  const min = 2000; // 2 sec
  const max = 6000; // 6 sec

  function scheduleBlink() {
    const delay = Math.random() * (max - min) + min;

    setTimeout(() => {
      blink();
      scheduleBlink();
    }, delay);
  }

  scheduleBlink();
}

startBlinkLoop();
</script>

</body>
</html>
